name: Import verified NOVA artifacts
on:
  push:
    branches: [chore/nova-f4-f5-organize]
    paths: ['.nova-import/ready.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/nova-f4-f5-organize
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode and verify enumerated source files and frozen statistics
        run: python .nova-import/apply.py
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce F4 once and compare all frozen winners
        run: |
          python src/optimize_v4.py --search --rounds 64 --iterations 100000
          python src/optimize_v4.py --enumerate-number-row
          python scripts/verify_frozen_import.py --version v4
          python src/report_v4.py
      - name: Reproduce F5 once and compare all frozen winners
        run: |
          python src/optimize_v5.py --rounds 32 --iterations 100000
          python scripts/verify_frozen_import.py --version v5
          python src/report_v5.py
      - name: Organize entry points and run lightweight validation
        run: |
          python scripts/organize_repository.py
          python src/benchmark.py --check
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
      - name: Commit verified files to research branch
        run: |
          rm -rf .nova-import
          rm .github/workflows/import-nova-artifacts.yml
          rm scripts/verify_frozen_import.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'research: import F4, add semantic-pair F5, and organize documentation'
          git push origin HEAD:chore/nova-f4-f5-organize
