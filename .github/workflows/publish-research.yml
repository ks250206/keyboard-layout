name: Reconstruct and verify F4-F5 publication
on:
  push:
    branches: [publish/f4-f5-kla-20261031]
    paths: [publication/start.json]
permissions:
  contents: read
concurrency:
  group: f4-f5-publication
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numerical environment
        run: python -m pip install -r requirements-v4.txt
      - name: Reconstruct original corpus counts with hash verification
        run: python publication/restore_raw.py .
      - name: Reproduce frozen search with original random seeds
        run: |
          python src/optimize_v4.py --search --rounds 64 --iterations 100000
          python src/optimize_v4.py --enumerate-number-row
          python src/optimize_v4.py --report
          python src/optimize_v5.py --search --rounds 64 --iterations 100000
          python src/optimize_v5.py --evaluate
      - name: Verify numerical results before rendering
        run: python publication/verify_snapshot.py
      - name: Render diagrams, reports and complete KLA tables
        run: |
          python src/report_v4.py
          python src/report_v5.py
          python tools/build_navigation.py
          python tools/check_readme.py
      - name: Regression tests and reproducibility
        run: |
          python tools/check_f4.py
          python tools/check_f5.py
          python -m unittest discover -s tests -p 'test_optimize_v[45].py' -v
      - name: Commit verified generated artifacts to the staging branch only
        env:
          EXPECTED_BRANCH: publish/f4-f5-kla-20261031
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/index.html data/v4 data/v5 results/v4 results/v5 results/kla_all.csv diagrams/f4 diagrams/f5 layouts/f4 layouts/f5 docs/f4 docs/f5
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish verified F4/F5 layouts, benchmarks, diagrams and complete KLA tables'
            git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          fi
