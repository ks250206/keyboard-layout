name: Verify benchmarks diagrams and README
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-v4.txt
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-v4.txt
      - name: Verify frozen scores and README without re-running search
        run: |
          python src/benchmark.py --check
          python tools/check_f4.py
          python tools/check_f5.py
          python tools/check_publication_snapshot.py
          python tools/check_readme.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
