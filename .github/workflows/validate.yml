name: Verify benchmarks and diagrams
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reproducibility check and tests (stdlib only)
        run: |
          python src/benchmark.py --check
          python -m unittest discover -s tests -v
